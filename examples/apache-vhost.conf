# Apache ohne .htaccess (AllowOverride None), z. B. eigener Server oder Docker.
# In den <VirtualHost>-Block Ihrer Seite. Mit Shared Hosting brauchen Sie das nicht:
# Dort wirken die mitgelieferten .htaccess-Dateien.

<Directory "/var/www/html/adventskalender/inhalte">
    Require all denied
</Directory>

<Directory "/var/www/html/adventskalender/lib">
    Require all denied
</Directory>
