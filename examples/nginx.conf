# nginx + PHP-FPM: Ausschnitt für den server { … }-Block Ihrer Seite.
#
# nginx liest keine .htaccess. Ohne diese zwei Regeln sind Texte und Bilder
# des Adventskalenders vorab abrufbar. Wichtig ist das „^~“: Es sorgt dafür,
# dass die Sperre vor Ihrer PHP-Regel (location ~ \.php$) greift.
#
# Liegt der Kalender in einem Unterordner, den Pfad anpassen, z. B. /shop/adventskalender/inhalte/.

location ^~ /adventskalender/inhalte/ {
    deny all;
}

location ^~ /adventskalender/lib/ {
    deny all;
}

